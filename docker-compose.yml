version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nih_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nih_web_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword123@postgres:5432/hospital_db?schema=public
      - NEXTAUTH_SECRET=hospital-production-secret-jwt-key-min-32-chars-long
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=Naseem Ijaz Hospital
      - NEXT_PUBLIC_APP_CITY=Lahore, Pakistan
      - SMS_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups

volumes:
  pgdata:
    driver: local
